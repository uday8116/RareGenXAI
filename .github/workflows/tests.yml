name: Verify RareGenXAI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Download and validate official HPO data
        run: python -m src.data
      - name: Verify downloaded HPO checksums and processed profiles
        run: python scripts/doctor.py --require-data
      - name: Build and verify versioned SQLite HPO knowledge base
        run: |
          python -m src.knowledge_db build
          python -m src.knowledge_db verify --raw-dir data/raw
          python -m pytest -q tests/test_db_integration.py
      - name: Train and evaluate ML reranking models
        run: python -m src.train_ml --train-diseases 120 --test-diseases 30 --queries-per-disease 1 --candidates 25
      - name: Verify saved model bundle, test splits and source provenance
        run: python -m src.verify_models --raw-dir data/raw
      - name: Verify local ML artifact was generated
        run: python scripts/doctor.py --require-data --require-model
      - name: Exercise official HPO and model through local FastAPI
        env:
          RAREGEN_REQUIRE_PHASE4_INTEGRATION: '1'
        run: python -m pytest -q tests/test_api_integration.py
      - name: Streamlit integration test with official HPO data
        run: python -m pytest -q tests/test_app_integration.py
      - name: Run reproducible synthetic benchmark
        run: python -m src.evaluate --trials 12 --seed 42
      - name: Evaluate evidence-weight behavior
        run: python -m src.evidence_experiment
      - name: Generate evaluation figures
        run: python -m src.plots
      - name: Upload provenance and evaluation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raregen-verification
          path: |
            data/raw/manifest.json
            results/*.csv
            results/*.png
            results/*.json
          if-no-files-found: warn
