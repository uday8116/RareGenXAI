name: Verify RareGenXAI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Download and validate official HPO data
        run: python -m src.data
      - name: Run reproducible small synthetic smoke benchmark
        run: python -m src.evaluate --trials 3 --seed 42
      - name: Upload provenance and evaluation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raregen-verification
          path: |
            data/raw/manifest.json
            results/*.csv
          if-no-files-found: warn
