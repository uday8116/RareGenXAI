name: Phase 2 SQLite Knowledge Base

on:
  push:
    paths:
      - 'src/knowledge_db.py'
      - 'src/db_schema.py'
      - 'src/db_access.py'
      - 'tests/test_knowledge_db.py'
      - 'tests/test_db_integration.py'
      - '.github/workflows/phase2-data.yml'
      - 'docs/PHASE_02_DATA_DATABASE.md'
  pull_request:
    paths:
      - 'src/knowledge_db.py'
      - 'src/db_schema.py'
      - 'src/db_access.py'
      - 'tests/test_knowledge_db.py'
      - 'tests/test_db_integration.py'
      - '.github/workflows/phase2-data.yml'
      - 'docs/PHASE_02_DATA_DATABASE.md'
  workflow_dispatch:

jobs:
  fixture-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install loader dependencies
        run: python -m pip install 'pandas>=2.1,<3' pronto pytest requests
      - name: Test synthetic HPO fixtures and data integrity
        run: python -m pytest -q tests/test_knowledge_db.py

  official-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install loader dependencies
        run: python -m pip install pandas pronto requests pytest
      - name: Download official HPO and build profiles
        run: python -m src.data
      - name: Build actual local SQLite database
        run: python -m src.knowledge_db build --db data/local/raregen.sqlite3
      - name: Verify integrity, relationships and provenance
        run: python -m src.knowledge_db verify --db data/local/raregen.sqlite3 --raw-dir data/raw
      - name: Validate real official-data import
        run: python -m pytest -q tests/test_db_integration.py
      - name: Store import statistics
        run: python -m src.knowledge_db stats --db data/local/raregen.sqlite3 > data/local/phase2-import-stats.json
      - uses: actions/upload-artifact@v4
        with:
          name: phase2-source-provenance-and-statistics
          path: |
            data/raw/manifest.json
            data/local/phase2-import-stats.json
          if-no-files-found: error
