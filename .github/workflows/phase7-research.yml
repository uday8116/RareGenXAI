name: Phase 7 Research Experiment Integrity
on:
  push:
    branches: [main]
    paths:
      - 'src/phase7_experiments.py'
      - 'src/evaluate_external.py'
      - 'tests/test_phase7_experiments.py'
      - 'src/phase7_historical_reaudit.py'
      - 'tests/test_phase7_historical_reaudit.py'
      - 'docs/PHASE_07_HISTORICAL_REANALYSIS.md'
      - 'scripts/verify_phase7.sh'
      - 'docs/PHASE_07_RESEARCH_EXPERIMENTS.md'
      - '.github/workflows/phase7-research.yml'
  pull_request:
    paths:
      - 'src/phase7_experiments.py'
      - 'src/evaluate_external.py'
      - 'tests/test_phase7_experiments.py'
      - 'src/phase7_historical_reaudit.py'
      - 'tests/test_phase7_historical_reaudit.py'
      - 'docs/PHASE_07_HISTORICAL_REANALYSIS.md'
      - 'scripts/verify_phase7.sh'
      - 'docs/PHASE_07_RESEARCH_EXPERIMENTS.md'
      - '.github/workflows/phase7-research.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preregistration-and-audit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal verification dependencies
        run: python -m pip install 'pytest>=8,<10'
      - name: Test complete paired matrix, source tampering and confidence intervals
        run: python -m pytest -q tests/test_phase7_experiments.py tests/test_phase7_historical_reaudit.py
      - name: Check executable Phase 7 acceptance recipe
        run: bash -n scripts/verify_phase7.sh
      - name: Validate research experiment CLI
        run: python -m src.phase7_experiments --help
