name: Phase 4 Local FastAPI Backend

on:
  push:
    paths:
      - 'src/api.py'
      - 'src/api_service.py'
      - 'src/api_schemas.py'
      - 'src/db_access.py'
      - 'src/model_bundle.py'
      - 'requirements.txt'
      - 'tests/test_api.py'
      - 'tests/test_api_integration.py'
      - 'docs/PHASE_04_BACKEND.md'
      - '.github/workflows/phase4-api.yml'
  pull_request:
    paths:
      - 'src/api.py'
      - 'src/api_service.py'
      - 'src/api_schemas.py'
      - 'src/db_access.py'
      - 'src/model_bundle.py'
      - 'requirements.txt'
      - 'tests/test_api.py'
      - 'tests/test_api_integration.py'
      - 'docs/PHASE_04_BACKEND.md'
      - '.github/workflows/phase4-api.yml'
  workflow_dispatch:

jobs:
  api-unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Apple Silicon OpenMP runtime
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Install Python packages
        run: python -m pip install -r requirements.txt
      - name: Offline API and OpenAPI tests
        run: python -m pytest -q tests/test_api.py
      - name: Compile backend source
        run: python -m compileall -q src/api.py src/api_service.py src/api_schemas.py

  official-api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install packages
        run: python -m pip install -r requirements.txt
      - name: Prepare official HPO source and Phase 2 SQLite
        run: |
          python -m src.data
          python -m src.knowledge_db build
          python -m src.knowledge_db verify --raw-dir data/raw
      - name: Train trusted Phase 3 research models for API smoke test
        run: |
          python -m src.train_ml --seed 42 --train-diseases 120 --test-diseases 30 --queries-per-disease 1 --candidates 25
          python -m src.verify_models --raw-dir data/raw
      - name: Exercise official HPO search and model ranking through FastAPI
        env:
          RAREGEN_REQUIRE_PHASE4_INTEGRATION: '1'
        run: python -m pytest -q tests/test_api.py tests/test_api_integration.py
      - name: Export API OpenAPI document
        run: |
          python -c "import json; from src.api import app; from pathlib import Path; Path('openapi.json').write_text(json.dumps(app.openapi(), indent=2) + '\n')"
      - name: Upload OpenAPI contract and source manifest
        uses: actions/upload-artifact@v4
        with:
          name: phase4-local-openapi-contract
          path: |
            openapi.json
            data/raw/manifest.json
          retention-days: 14
          if-no-files-found: error
