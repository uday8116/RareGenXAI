name: Phase 1 Foundation Checks

on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/test_foundation.py'
      - '.github/workflows/foundation.yml'
      - '.python-version'
      - 'docs/PHASE_01_FOUNDATION.md'
      - 'docs/LOCAL_DEVELOPMENT_MACOS.md'
      - 'docs/PROJECT_IMPLEMENTATION_ROADMAP.md'
      - '.gitignore'
      - 'README.md'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/test_foundation.py'
      - '.github/workflows/foundation.yml'
      - '.python-version'
      - 'docs/PHASE_01_FOUNDATION.md'
      - 'docs/LOCAL_DEVELOPMENT_MACOS.md'
      - 'docs/PROJECT_IMPLEMENTATION_ROADMAP.md'
      - '.gitignore'
      - 'README.md'
  workflow_dispatch:

jobs:
  isolated-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check script syntax
        run: bash -n scripts/bootstrap_macos.sh scripts/verify_local.sh
      - name: Run isolated foundation tests
        run: python -m unittest discover -s tests -p 'test_foundation.py' -v
      - name: Run pre-install diagnostic
        run: python scripts/doctor.py --minimal --json

  apple-silicon-install:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check native architecture
        run: |
          test "$(uname -m)" = "arm64"
          python3.11 -c "import platform; assert platform.machine() == 'arm64'"
      - name: Run actual macOS bootstrap
        run: bash scripts/bootstrap_macos.sh
      - name: Confirm local dependency snapshot
        run: test -s environment-local.txt
      - name: Run quick local verification
        run: bash scripts/verify_local.sh --quick
