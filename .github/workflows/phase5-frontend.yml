name: Phase 5 React Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'docs/PHASE_05_FRONTEND.md'
      - 'docs/PHASE_05_FINAL_AUDIT.md'
      - 'scripts/start_frontend.sh'
      - 'scripts/smoke_phase5.py'
      - '.github/workflows/phase5-frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/PHASE_05_FRONTEND.md'
      - 'docs/PHASE_05_FINAL_AUDIT.md'
      - 'scripts/start_frontend.sh'
      - 'scripts/smoke_phase5.py'
      - '.github/workflows/phase5-frontend.yml'
  workflow_dispatch:

jobs:
  frontend-test-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency-free local API/export logic checks
        run: npm run test:logic
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend integration tests
        run: npm run test
      - name: Build Vite website
        run: npm run build
      - name: Verify distribution
        run: |
          test -f dist/index.html
          test -d dist/assets
      - name: Publish temporary preview build artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: phase5-local-frontend-build
          path: frontend/dist/
          retention-days: 14
          if-no-files-found: error
