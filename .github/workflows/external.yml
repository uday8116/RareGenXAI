name: External RareBench Patient Evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/phase7_experiments.py'
      - 'tests/test_phase7_experiments.py'
      - 'scripts/verify_phase7.sh'
      - 'src/rarebench.py'
      - 'src/evaluate_external.py'
      - 'src/ml.py'
      - 'src/paired_stats.py'
      - 'src/train_ml.py'
      - 'src/model_bundle.py'
      - 'src/verify_models.py'
      - '.github/workflows/external.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONHASHSEED: '42'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  patient_benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare official HPO annotations
        run: python -m src.data
      - name: Build versioned HPO knowledge base
        run: |
          python -m src.knowledge_db build
          python -m src.knowledge_db verify --raw-dir data/raw
      - name: Train and verify synthetic HPO model bundle
        run: |
          python -m src.train_ml --seed 42 --train-diseases 600 --test-diseases 120 --queries-per-disease 2 --candidates 40
          python -m src.verify_models --db data/local/raregen.sqlite3 --raw-dir data/raw
      - name: Fetch published patient test cases
        run: python -m src.rarebench --limit-per-subset 100000
      - name: Freeze official external experiment before ranking
        run: |
          python -m src.phase7_experiments freeze \
            --cases data/external/rarebench_cases.csv \
            --dataset-manifest data/external/rarebench_manifest.json \
            --model-manifest models/raregen_ml.manifest.json \
            --model models/raregen_ml.joblib \
            --methods tfidf logistic random_forest xgboost mlp overlap \
            --retrieval-k 40 --seed 42 --out results/phase7_plan.json
      - name: Evaluate all pre-registered published cases
        run: |
          python -m src.evaluate_external \
            --cases data/external/rarebench_cases.csv \
            --model models/raregen_ml.joblib \
            --methods tfidf logistic random_forest xgboost mlp overlap \
            --retrieval-k 40 --out results/external_case_results.csv
      - name: Phase 7 strict paired cohort and provenance audit
        run: |
          python -m src.phase7_experiments audit \
            --cases data/external/rarebench_cases.csv \
            --dataset-manifest data/external/rarebench_manifest.json \
            --model-manifest models/raregen_ml.manifest.json \
            --model models/raregen_ml.joblib \
            --plan results/phase7_plan.json \
            --results results/external_case_results.csv \
            --legacy-summary results/external_cohort_summary.csv \
            --replicates 2000 --out-dir results
      - name: Legacy exploratory bootstrap for backward comparability
        run: python -m src.paired_stats
      - name: Upload patient-level benchmark and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-patient-benchmark
          path: |
            data/external/rarebench_manifest.json
            results/external_case_results.csv
            results/external_cohort_summary.csv
            results/external_paired_bootstrap.csv
            results/phase7_plan.json
            results/phase7_provenance.json
            results/phase7_case_audit.csv
            results/phase7_cohort_metrics.csv
            results/phase7_paired_effects.csv
            results/phase7_error_analysis.csv
            results/ml_summary.csv
            models/raregen_ml.manifest.json
            data/raw/manifest.json
            results/ml_metadata.json
          if-no-files-found: warn
